[project]
name = "vitool"
version = "0.1.0"
description = "A small personal Vinted Germany watchlist"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4>=4.13,<5", "httpx>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
vitool = "vitool.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
